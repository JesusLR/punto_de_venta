  <path d="M239 236C195 211 148 141 139 78c49 33 87 95 100 158Z" fill="url(#wing)" stroke="#987441" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M233 224c-25-39-52-83-80-126m73 118c-24-26-48-62-63-92m56 84c-25-21-43-47-51-64m44 56c-21-15-35-31-42-43" stroke="#95713E" stroke-width="1.1" stroke-opacity=".5" stroke-linecap="round"/>
