  <path d="M223 260c-21 30-64 81-98 103 11-35 42-83 73-111Z" fill="url(#tail)" stroke="#987441" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M213 270c-6 32-17 68-35 92 0-32 6-64 17-90Z" fill="#B5915B" stroke="#987441" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="m201 273-61 72" stroke="#F2E1C0" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Head, slender neck and rounded breast. -->
  <path d="M197 261c27-8 33-26 36-48 2-20 5-39 21-49 12-8 29-4 36 7 7 12 4 25-7 33-9 7-15 17-18 29-5 25-22 47-47 49-9 0-17-8-21-21Z" fill="url(#body)" stroke="#927040" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M275 199c-13 14-17 36-25 48-8 14-19 22-33 25" stroke="#F3E3C5" stroke-width="2" stroke-linecap="round" stroke-opacity=".8"/>
  <path d="M287 177 363 155l-71 30Z" fill="#8A683A"/>
  <circle cx="278" cy="176" r="2.6" fill="#584126"/>
  <circle cx="279" cy="175" r=".8" fill="#FFF4DC"/>
