<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" fill="none">
  <defs>
    <linearGradient id="wing" x1="112" y1="86" x2="255" y2="266" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2E3C3"/>
      <stop offset=".5" stop-color="#C6A16A"/>
      <stop offset="1" stop-color="#94703F"/>
    </linearGradient>
    <linearGradient id="body" x1="264" y1="167" x2="186" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCC49A"/>
      <stop offset=".5" stop-color="#B18A50"/>
      <stop offset="1" stop-color="#7D5B30"/>
    </linearGradient>
    <linearGradient id="tail" x1="219" y1="260" x2="126" y2="359" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B99258"/>
      <stop offset="1" stop-color="#E2CEAA"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#E4CFA6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#E4CFA6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="220" cy="214" r="184" fill="url(#halo)"/>
  <circle cx="220" cy="214" r="162" stroke="#B99862" stroke-width=".8" stroke-opacity=".22"/>
  <circle cx="220" cy="214" r="149" stroke="#B99862" stroke-opacity=".14" stroke-dasharray="2 9"/>
