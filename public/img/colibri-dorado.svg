  <path d="M238 231C197 224 124 191 74 185c35 37 104 67 150 66Z" fill="#DCC49A" stroke="#A58452" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M229 241c-47-11-92-30-133-46m116 49c-27-3-66-14-94-26" stroke="#A58452" stroke-opacity=".45" stroke-linecap="round"/>
